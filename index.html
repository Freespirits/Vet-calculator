<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Accessibility: allow zoom (do NOT set maximum-scale / user-scalable=no) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B14" />
    <!-- title / description / canonical / hreflang / social cards are
         per-language-page and injected at build time by SeoHead.tsx -->

    <!-- Structured data: helps search engines surface the calculators -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Vet-Holim · וט־חולים — Veterinary Calculator",
        "url": "https://vet-holim.work/",
        "applicationCategory": "MedicalApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "browserRequirements": "Requires JavaScript for interactive calculations; core page content is server-rendered.",
        "inLanguage": ["he", "en", "ar", "ru", "fr", "es", "de", "pt", "it", "pl", "tr", "hi", "ja", "zh"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": ["Medication dose and volume calculation", "Fourteen veterinary toxic-exposure calculators", "Toxic-plant reference library", "Patient session", "Fourteen localized interfaces"],
        "citation": [
          "https://www.merckvetmanual.com/toxicology/food-hazards/chocolate-toxicosis-in-animals",
          "https://www.merckvetmanual.com/toxicology/ethylene-glycol-toxicosis/ethylene-glycol-toxicosis-in-animals",
          "https://pubmed.ncbi.nlm.nih.gov/30064708/",
          "https://pubmed.ncbi.nlm.nih.gov/35869755/"
        ],
        "description": "Clinical decision-support calculator for veterinary professionals: drug dosage (130+ drugs, Plumb's-cited) and toxicity triage for dogs and cats (chocolate, grapes, xylitol, lilies and more), every threshold cited."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- dotLottie player web component (defines <dotlottie-player>) -->
    <script
      src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
      type="module"
      integrity="sha384-ypAFdIpmPhrhuVLN9fmIZaqZHGUVSzHiiplL/kPO2+gJ4Na4yRVbVt0YhyvWdbwn"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
