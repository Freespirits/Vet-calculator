# Runs the four quality checks from the README on every pull request and on
# pushes to the default branch: lint, unit tests, build, browser checks.
#
# Nothing here deploys anything; Vercel builds and deploys on its own. Until
# this workflow existed only the build ran automatically, which is how 26 lint
# errors accumulated unnoticed.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # The repository's default branch at the time of writing.
      - claude/vet-dosage-calculator-hxo4f

# The checks only read the code.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, build, browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build (type check and prerender all language pages)
        run: npm run build

      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium

      # Playwright starts `vite preview` on the build made above.
      - name: Browser checks against the built site
        run: npx playwright test

      - name: Keep the browser report when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
