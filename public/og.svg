<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="aurora1" cx="25%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="85%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#070B14"/>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- aurora ribbons -->
  <path d="M-50,180 C220,80 420,220 660,140 C880,70 1060,150 1250,90"
        stroke="url(#ribbon)" stroke-width="5" fill="none" opacity="0.7"/>
  <path d="M-50,230 C260,140 480,260 720,190 C930,130 1090,200 1250,150"
        stroke="url(#ribbon)" stroke-width="3" fill="none" opacity="0.35"/>

  <!-- particles -->
  <g fill="#7FE9DA">
    <circle cx="140" cy="110" r="3" opacity="0.9"/>
    <circle cx="320" cy="70" r="2" opacity="0.6"/>
    <circle cx="540" cy="105" r="2.5" opacity="0.7"/>
    <circle cx="760" cy="60" r="2" opacity="0.5"/>
    <circle cx="980" cy="120" r="3" opacity="0.8"/>
    <circle cx="1120" cy="220" r="2" opacity="0.6"/>
    <circle cx="90" cy="330" r="2" opacity="0.5"/>
    <circle cx="1060" cy="420" r="2.5" opacity="0.6"/>
  </g>
  <g fill="#B9A6F8">
    <circle cx="240" cy="190" r="2.5" opacity="0.7"/>
    <circle cx="680" cy="150" r="2" opacity="0.55"/>
    <circle cx="880" cy="220" r="2.5" opacity="0.7"/>
    <circle cx="160" cy="480" r="2" opacity="0.5"/>
  </g>

  <!-- paw mark -->
  <g transform="translate(600,255)" fill="#2DD4BF">
    <ellipse cx="0" cy="22" rx="34" ry="28" opacity="0.95"/>
    <ellipse cx="-38" cy="-12" rx="13" ry="17" transform="rotate(-18 -38 -12)" opacity="0.95"/>
    <ellipse cx="-13" cy="-26" rx="13" ry="17" transform="rotate(-6 -13 -26)" opacity="0.95"/>
    <ellipse cx="13" cy="-26" rx="13" ry="17" transform="rotate(6 13 -26)" opacity="0.95"/>
    <ellipse cx="38" cy="-12" rx="13" ry="17" transform="rotate(18 38 -12)" opacity="0.95"/>
  </g>

  <!-- title -->
  <text x="600" y="392" text-anchor="middle" font-family="Heebo, Arial, sans-serif"
        font-size="64" font-weight="800" fill="#F4F7FB">וט־חולים · Vet-Holim</text>
  <text x="600" y="448" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#9DB2CE">Veterinary dosage &amp; toxicity calculator — dogs &amp; cats</text>

  <!-- footer chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="280" y="505" rx="22" width="200" height="44" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="380" y="534" text-anchor="middle" fill="#7FE9DA">130+ drugs</text>
    <rect x="500" y="505" rx="22" width="200" height="44" fill="#8B5CF6" fill-opacity="0.16" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <text x="600" y="534" text-anchor="middle" fill="#C4B0FA">14 toxins</text>
    <rect x="720" y="505" rx="22" width="200" height="44" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="820" y="534" text-anchor="middle" fill="#7DE8C0">14 languages</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="22" fill="#5F718C">vet-holim.work</text>
